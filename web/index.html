<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Find the people and organizations with the most relevant demonstrated expertise for the exact technical problem you're working on." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='12' cy='16' r='9' fill='%234c6ef5' fill-opacity='.85'/><circle cx='20' cy='16' r='9' fill='%2312b886' fill-opacity='.85'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      /* Theme before paint: a stored choice wins; "system" follows the OS; default is light regardless of OS. */
      (function () {
        var c = null;
        try { c = localStorage.getItem('overlap-theme'); } catch (e) { /* storage unavailable */ }
        var t = c === 'dark' ? 'dark' : c === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <title>Overlap — find who has actually solved your problem</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
